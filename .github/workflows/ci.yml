name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -B build

    - name: Build Project (Library, Tests, and CLI)
      run: cmake --build build

    - name: Verify CLI Compilation (Smoke Test)
      run: echo "help" | ./build/minidb_cli

    - name: Run Tests (CTest)
      run: ctest --test-dir build --output-on-failure

    - name: Run Benchmarks (Stress Tests)
      run: ./build/benchmark_minidb
